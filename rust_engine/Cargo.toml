[package]
name = "openvocal_engine"
version = "0.1.0"
edition = "2021"
description = "High-performance audio engine for OpenVocal"
license = "MIT"

[lib]
name = "openvocal_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
cpal = "0.15"
ringbuf = "0.3"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rubato = "0.14"  # High-quality resampling for pitch shifting
realfft = "3.3"  # FFT for spectral processing

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
