[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openvocal"
version = "0.1.0"
description = "Open-source vocal pitch correction with visual blob editing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "OpenVocal Contributors"}
]
keywords = ["audio", "pitch-correction", "vocal", "music", "dsp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]

dependencies = [
    "PyQt6>=6.4.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchcrepe>=0.0.22",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "resampy>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
openvocal = "openvocal.__main__:main"

[project.urls]
Homepage = "https://github.com/openvocal/openvocal"
Repository = "https://github.com/openvocal/openvocal"
Issues = "https://github.com/openvocal/openvocal/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
